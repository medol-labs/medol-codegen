server:
  port: ${SERVER_PORT:<%= appPort %>}

spring:
  config:
    import: optional:file:<%= envFile %>[.properties]
  application:
    name: <%= appName %>
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:<%= dockerComposeEnabled %>}
      file: ${DOCKER_COMPOSE_FILE:<%= composeFile %>}
      lifecycle-management: start-and-stop
      profiles:
        active: axon-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:<%= dbPort %>/<%= dbName %>}
    username: ${DB_USERNAME:medol}
    password: ${DB_PASSWORD:medol}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  update-check:
    disabled: ${AXON_UPDATE_CHECK_DISABLED:false}
  converter:
    general: jackson2
    messages: jackson2
    events: jackson2
  axonserver:
    enabled: ${AXON_SERVER_ENABLED:false}
    servers: ${AXON_SERVER_SERVERS:localhost:8124}
    context: ${AXON_SERVER_CONTEXT:default}
    event-store:
      enabled: ${AXON_SERVER_EVENT_STORE_ENABLED:true}

medol:
  axon:
    event-storage: ${MEDOL_AXON_EVENT_STORAGE:umadb}
<% if (hasInfra) { -%>
    umadb:
      target: ${UMADB_TARGET:localhost:50051}
      plaintext: ${UMADB_PLAINTEXT:true}
      api-key: ${UMADB_API_KEY:}
      batch-size: ${UMADB_BATCH_SIZE:256}
      request-timeout: ${UMADB_REQUEST_TIMEOUT:PT10S}
<% } -%>
<% if (externalSystems.length > 0) { -%>

external:
<% externalSystems.forEach((external) => { -%>
  <%= external.configKey %>:
    endpoint: ${<%= external.endpointEnv %>:}
<% }) -%>
<% } -%>
<% if (integrationClients.length > 0) { -%>

integration:
<% integrationClients.forEach((client) => { -%>
  <%= client.configKey %>:
    endpoint: ${<%= client.endpointEnv %>:}
<% }) -%>
<% } -%>

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.axonframework: INFO
