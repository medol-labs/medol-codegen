server:
  port: ${SERVER_PORT:<%= appPort %>}

spring:
  application:
    name: <%= appName %>
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:<%= dockerComposeEnabled %>}
      file: ${DOCKER_COMPOSE_FILE:<%= composeFile %>}
      lifecycle-management: start-and-stop
      profiles:
        active: axon-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:<%= dbPort %>/<%= dbName %>}
    username: ${DB_USERNAME:medol}
    password: ${DB_PASSWORD:medol}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  converter:
    general: jackson2
    messages: jackson2
    events: jackson2
  axonserver:
    enabled: ${AXON_SERVER_ENABLED:true}
    servers: ${AXON_SERVER_SERVERS:localhost:8124}
    context: ${AXON_SERVER_CONTEXT:default}
    event-store:
      enabled: ${AXON_SERVER_EVENT_STORE_ENABLED:true}

medol:
  axon:
    event-storage: ${MEDOL_AXON_EVENT_STORAGE:axon-server}
<% if (externalSystems.length > 0) { -%>

external:
<% externalSystems.forEach((external) => { -%>
  <%= external.configKey %>:
    endpoint: ${<%= external.endpointEnv %>:}
<% }) -%>
<% } -%>

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
