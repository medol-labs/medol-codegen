spring:
  application:
    name: medol-axon5
  docker:
    compose:
      lifecycle-management: start-and-stop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medol}
    username: ${DB_USERNAME:medol}
    password: ${DB_PASSWORD:medol}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  axonserver:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
