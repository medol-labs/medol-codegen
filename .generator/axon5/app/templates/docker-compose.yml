services:
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:-<%= dbPort %>}:5432"
    environment:
      POSTGRES_USER: medol
      POSTGRES_PASSWORD: medol
      POSTGRES_DB: <%= dbName %>
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medol -d <%= dbName %>"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
