services:
  console:
    image: ${CONSOLE_IMAGE:-medol/<%= imageName %>:0.0.1-SNAPSHOT}
    container_name: ${CONSOLE_CONTAINER_NAME:-<%= imageName %>}
    ports:
      - "${CONSOLE_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
