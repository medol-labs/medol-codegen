services:
  console:
    image: ${CONSOLE_IMAGE:-medol/<%= imageName %>:0.0.1-SNAPSHOT}
    container_name: ${CONSOLE_CONTAINER_NAME:-<%= imageName %>}
    ports:
      - "${CONSOLE_PORT:-5173}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_SUPABASE_API_KEY: ${VITE_SUPABASE_API_KEY:-}
      VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-local}
      VITE_ACCESS_CONTROL_MODE: ${VITE_ACCESS_CONTROL_MODE:-permissive}
      VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-}
      VITE_AXON_API_URL: ${VITE_AXON_API_URL:-}
<% backendModules.forEach((module) => { -%>
      <%= module.envName %>: ${<%= module.envName %>:-}
<% }) -%>
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
